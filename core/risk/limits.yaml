# Risk limits. Changing this file requires human approval and leaves an audit
# record; no agent may edit it as part of ordinary work (see CLAUDE.md).
version: 1
pod:
  gross_leverage_max: 1.5          # ceiling 3.0 once the platform is proven
  net_exposure: [-0.20, 0.20]
  single_name_max: 0.05            # share of NAV
  sector_max: 0.20
  style_beta_abs_max: 0.30         # FF5 + momentum
  liquidation_days_max: 3          # at 20% of ADV
  drawdown:                        # absolute AND distribution conditions must both hold
    warn:   {abs: -0.025, backtest_dd_pct: 80,  action: report}
    cut:    {abs: -0.050, backtest_dd_pct: 95,  action: halve_capital}
    stop:   {abs: -0.075, backtest_dd_pct: 99,  action: stop_pod}
fund:
  var95_1d_max: 0.02
  es975_1d_max: 0.03
  pod_avg_correlation_max: 0.30
  drawdown:
    reduce: {abs: -0.10, action: cut_gross_half}
    halt:   {abs: -0.15, action: halt_all}
financing:
  # Leverage comes from the prime broker; these limits are as binding as exposure.
  margin_utilization_max: 0.60      # share of available margin in use
  pb_concentration_max: 1.00        # single-broker share (1.0 while there is one broker)
  financing_cost_bps_max: 150       # annualised financing cost on the borrow
  overnight_cash_buffer_min: 0.10   # share of NAV held as cash overnight
capacity:
  # Capacity is a hard cap, not a target. Capital above the cap is not allocated
  # even when performance is good: the return comes first, the size second.
  respect_hard_cap: true
  capacity_utilisation_max: 0.80    # allocate at most 80% of the estimated capacity
horizon:
  # Medallion-style diversification is across many horizons, not one.
  risk_budget_share_max: 0.60       # no single horizon may hold more than this
cost_attribution:
  # Pass-through economics: a pod carries the data and compute it consumes, and
  # the allocator reads IR net of that cost.
  charge_pods: true
  min_net_of_cost_ir: 0.0
gates:
  is_sharpe_min: 1.0
  oos_to_is_sharpe_ratio_min: 0.5
  fold_sign_stability_min: 0.70
  deflated_sharpe_probability_min: 0.95   # Bailey & López de Prado (2014): DSR는 확률이다
  pbo_max: 0.05
  bootstrap_pvalue_max: 0.05              # 블록 부트스트랩, 단측
  dd_to_return_ratio_max: 2.0             # 최대DD / 연율 수익
  residual_alpha_tstat_min: 3.0    # Harvey, Liu & Zhu (2016)
  book_correlation_abs_max: 0.30
  adv_participation_max: 0.03
  paper_trading_days_min: 60
