name: data-snapshot

# Where the market data actually comes from. Claude's research container has no
# route to any vendor host (every one is refused by its egress proxy), but this
# runner does, so the fetch lives here. ADR-0007 has the reasoning, including why
# prices are never committed and never uploaded as an artifact: on a public
# repository an artifact is a public download, and that would be redistribution.

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: Comma-separated symbols
        default: SPY,QQQ,IWM,TLT,GLD
      source:
        description: auto, stooq or yahoo
        default: auto
      years:
        description: Years of history
        default: "20"
  schedule:
    - cron: "17 7 * * 6"   # Saturday, after the week's US closes are final
  push:
    branches: [main]
    paths:
      - scripts/fetch_prices.py
      - scripts/fetch_factors.py
      - scripts/data_snapshot.py
      - scripts/stress_report.py
      - scripts/impact_report.py
      - scripts/gate_power.py
      - scripts/submit_alpha.py
      - scripts/alpha_status.py
      - core/alphas/lifecycle.py
      - core/backtest/power.py
      - core/backtest/prereg.py
      - core/strategies/library.py
      - core/alphas/implementations.py
      - core/alphas/universes.py
      - core/backtest/breadth.py
      - core/data/universe.py
      - scripts/universe_frontier.py
      # 판정을 만드는 모듈은 러너에서만 시세를 보므로, 여기 없으면 그 변경은
      # 며칠 뒤 다른 커밋의 실행에서 처음 돌아간다. `sources.py`의 매니페스트
      # 왕복 결함이 실제로 그렇게 새어 나갔다 — 엔진을 고친 커밋은 이 워크플로를
      # 돌리지 않았고, 선언을 푸시한 커밋이 그 대가를 치렀다 (ADR-0047).
      - core/data/sources.py
      - core/backtest/engine.py
      - core/backtest/gates.py
      - core/features/catalog.py
      - core/risk/limits.yaml
      - registry/alphas/**
      - .github/workflows/data-snapshot.yml

permissions:
  contents: write

concurrency:
  group: data-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # 가격 수집은 종목 수만큼의 요청이고, 이제 다섯이 아니라 선언된 미국 전 종목이다.
    # 프론티어도 상장일마다 패널을 한 번씩 읽는다.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - name: Install
        run: uv sync --extra dev

      - name: Fetch daily bars
        id: fetch
        run: |
          uv run python -m scripts.fetch_prices \
            ${{ github.event.inputs.symbols && format('--symbols "{0}"', github.event.inputs.symbols) || '' }} \
            --source "${{ github.event.inputs.source || 'auto' }}" \
            --years "${{ github.event.inputs.years || '20' }}"

      # G4's residual alpha is measured against FF5 + momentum when this
      # succeeds and against the engine's panel proxy when it does not. A factor
      # fetch that fails must not take the price snapshot down with it, so the
      # step is allowed to fail and the verdict records which model it used
      # (ADR-0014).
      - name: Fetch the Fama-French factors
        id: factors
        continue-on-error: true
        run: uv run python -m scripts.fetch_factors

      - name: Snapshot and run the gates
        run: uv run python -m scripts.data_snapshot

      # Committed before the stress step runs, and not only for "commit first,
      # red afterwards": `core/repro.py` refuses to pin a dirty tree, and the
      # snapshot's own output is what makes it dirty. Measuring the stress suite
      # against a scratch pin would put a run id in the report that does not
      # describe the code that produced it.
      - name: Commit the manifest
        if: always()
        run: |
          scripts/commit_generated.sh registry/snapshots "data: 스냅샷 매니페스트와 게이트 스모크 결과

          workflow: data-snapshot (${{ github.run_id }})
          가격 데이터는 커밋하지 않는다. 매니페스트(해시·날짜·행수)와 게이트
          판정만 남긴다 (ADR-0007)."

      # The stress suite rides along because the factor file is already on this
      # disk, and it is the file the scenarios take their magnitudes from
      # (ADR-0027). `continue-on-error` because an unevaluable suite exits 1 on
      # purpose: the report naming the gap is still written and still worth
      # committing.
      - name: Stress the smoke book against the historical scenarios
        id: stress
        continue-on-error: true
        shell: bash
        run: uv run python -m scripts.stress_report

      - name: Commit the stress report
        if: always()
        run: |
          scripts/commit_generated.sh registry/stress "risk: 역사 시나리오 스트레스 리포트

          workflow: data-snapshot (${{ github.run_id }})
          팩터 파일(러너에만 있다)로 시나리오 손실을 재고 파생 숫자만 남긴다 (ADR-0027)."

      # The impact census rides along for the same reason the stress suite does:
      # the panel it needs is already on this disk, and Amihud's lambda needs
      # nothing else -- no key, no factor file, no approved alpha (ADR-0031).
      # `continue-on-error` because a panel that carries no dollar volume exits 1
      # on purpose, and the report naming that gap is the useful part.
      #
      # It runs after the stress commit for the same reason the stress step runs
      # after the manifest commit: `pin_current` refuses a dirty tree, and each
      # preceding step leaves one behind.
      - name: Measure Amihud illiquidity on the snapshot panel
        id: impact
        continue-on-error: true
        shell: bash
        run: uv run python -m scripts.impact_report | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the impact census
        if: always()
        run: |
          scripts/commit_generated.sh registry/impact "execution: Amihud 비유동성 센서스

          workflow: data-snapshot (${{ github.run_id }})
          종가와 거래대금으로 종목별 λ를 재고 북의 왕복 비용을 낸다. 종단 변위와
          선형 가정으로 비용을 높게 부르는 상한이고 체결 예측이 아니다. 비용 기반
          캐패시티는 그로스 엣지가 없어 미측정이다 (ADR-0031)."

      # The power report rides along because the only input it needs beyond the
      # limits table is the panel's length, which is already on this disk. It runs
      # last because it is the only step whose answer does not depend on the
      # others, so a failure here costs nothing already computed.
      #
      # `continue-on-error` because the script exits 1 when the *sample* rather
      # than the strategy is the binding constraint. That is a state, not a fault:
      # nothing is broken, the history is short (ADR-0033).
      - name: Invert the gates on this sample
        id: power
        continue-on-error: true
        shell: bash
        run: uv run python -m scripts.gate_power | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the power report
        if: always()
        run: |
          scripts/commit_generated.sh registry/power "research: 게이트 검정력 리포트

          workflow: data-snapshot (${{ github.run_id }})
          지금 보유한 표본 길이에서 각 통계 기준이 요구하는 최소 연율 샤프와,
          어느 기준이 구속하는지를 남긴다. 게이트가 아니고 판정도 아니다 (ADR-0033)."

      # The first real submission. Everything above this line measures the data;
      # this is the one step that makes a claim about a strategy, so it runs last
      # and on the same panel the reports above were measured on.
      #
      # **No `continue-on-error` here, on purpose.** The script exits 0 whether the
      # alpha is approved or rejected, because rejection is the ordinary outcome
      # and a red workflow for it would teach everyone to ignore the red. The only
      # non-zero exit is a refusal to evaluate at all -- no declaration, a grid
      # wider than the one declared, a reported configuration nobody declared --
      # and that is a fault in the process, which is exactly what a red run is for.
      # Every declared alpha, on one snapshot, under one pin and one desk-wide
      # trial count. A declaration that is never run would leave the desk's N
      # above the search anybody looked at, so --all refuses rather than skips
      # (ADR-0040).
      # The frontier rides along for the same reason the stress suite does: the
      # files it needs are already on this disk. `continue-on-error` because
      # exit 1 means no wider universe carries more *effective* bets than the one
      # the desk already trades, which is a finding and not a fault (ADR-0042).
      - name: Measure what a wider universe costs in history
        id: frontier
        continue-on-error: true
        shell: bash
        run: uv run python -m scripts.universe_frontier | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the universe frontier
        if: always()
        run: |
          scripts/commit_generated.sh registry/universe "data: 유니버스 프론티어 — 창과 breadth의 교환

          workflow: data-snapshot (${{ github.run_id }})
          상장일마다 후보 유니버스가 하나씩 생긴다. 종목 하나 넓힐 때 창이 얼마
          짧아지고 실효 베팅 수가 얼마 오르는지를 재서 남긴다. 티커 수가 아니라
          상관구조의 엔트로피를 쓴다 (ADR-0042)."

      - name: Submit every declared alpha to the gate battery
        id: submission
        shell: bash
        run: uv run python -m scripts.submit_alpha --all | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the submission record
        if: always()
        run: |
          scripts/commit_generated.sh registry/submissions "research: 선언된 알파 전체의 게이트 배터리 판정

          workflow: data-snapshot (${{ github.run_id }})
          사전등록된 격자를 20년 패널에 돌리고 G0~G7 판정과 재현 핀, 카탈로그
          등록 결과를 알파마다 남긴다. 한 스냅샷·한 핀·한 데스크 N이라 알파
          사이를 비교할 수 있다. 기각은 정상 결과이고 승인은 G8과 별개다
          (ADR-0035, ADR-0036, ADR-0039, ADR-0040)."

      # The status table is derived from the records the steps above just wrote,
      # so it runs after the submission is committed and reads the committed
      # copy. No `continue-on-error`: exit 1 means the ledger will not parse, and
      # a malformed ledger reading as "nobody decided anything" is the failure
      # this whole derivation exists to prevent (ADR-0037).
      - name: Derive the alpha status table
        id: status
        shell: bash
        run: uv run python -m scripts.alpha_status | tee -a "$GITHUB_STEP_SUMMARY"

      # The path is the one generated file, not the directory: `git add
      # registry/alphas` would sweep up a modified declaration, and a
      # declaration committed by a runner after a result is exactly what G1
      # exists to catch.
      - name: Commit the status table
        if: always()
        run: |
          scripts/commit_generated.sh registry/alphas/STATUS.md "research: 알파 현황 표

          workflow: data-snapshot (${{ github.run_id }})
          선언은 고칠 수 없으므로 상태를 제출 기록과 원장에서 파생한다. 측정은
          올리고 원장은 내린다. live는 나오지 않는다 (ADR-0037)."
