# 사전등록. 백테스트를 돌리기 전에 커밋한다.
#
# 이 파일은 결과가 나온 뒤에 고치지 않는다(tsmom-001.yaml 머리말과 같은 이유).
# 게이트 판정은 `registry/submissions/<run_id>.<id>.json`에 남고, 아래 `gates:`
# 칸은 템플릿 형식을 지키느라 비워 둔다.
#
# **-001과 같은 코드, 같은 격자, 다른 유니버스.** ADR-0043이 실측한 스물여섯
# 종목에서 같은 가설을 다시 낸다. 한 번에 한 변수만 바꾸는 것이 요점이다 —
# 새 패밀리를 함께 내면 "breadth가 부족했다"와 "그 신호가 없었다"를 구분할 수
# 없다. 스물여섯은 성과로 고른 것이 아니라 **창을 하루도 쓰지 않는 최대 집합**이고,
# 근거는 `registry/universe/17121f69010340d5.frontier.json`이다.
id: bab-002
title: "저베타 — 크로스에셋 ETF 스물여섯, 베타 순위"
pod: alpha-pod-trend-macro
status: proposed            # proposed | gated | paper | live | stopped | retired

hypothesis:                 # G1, written before any backtest is run
  economic_rationale: >
    베타가 낮은 자산을 사고 높은 자산을 판다. Frazzini & Pedersen(2014). 근거는
    레버리지 제약이 있는 투자자가 고베타 자산을 대신 사서 비싸게 지불한다는 것이다.
    **베타 순위는 횡단면 통계이므로 다섯 자산에서는 사실상 순위가 없다** — 표본 내
    샤프가 -0.13이었다. 스물여섯에는 채권 넷(SHY·IEF·TLT·AGG)과 섹터 아홉이 있어
    베타가 실제로 퍼진다. 이것이 틀렸다면, 저베타 바스켓이 곧 채권 바스켓이 되어
    **G4의 잔차 알파 t값이 시장 프록시 대비 유의하지 않아야 한다** — 즉 저베타
    프리미엄이 아니라 듀레이션 베팅이었다는 뜻이 된다.
  universe: >
    ADR-0043이 실측한 미국 상장 ETF 스물여섯. 프론티어 산출물에서 **이력을 하루도
    쓰지 않으면서 유효 베팅이 가장 큰 집합**으로 고른 것이고, 성과를 보고 고른 것이
    아니다. 기준 다섯과 창이 같다(2006-09-25 ~ 2026-09-25). HYG와 VOO는 상장이
    늦어 빠졌다 — 버린 것이 아니라 창이 짧아지기 때문이고, 스물여덟 지점은 유효
    베팅이 **더 낮다**(VOO가 SPY·VTI와 같은 지수를 추종한다). 유효 베팅은 상관
    스펙트럼의 엔트로피이고 근본법칙 breadth의 상한이므로, 스킬·비용·캐패시티에
    대해서는 아무것도 약속하지 않는다. 섹터 ETF 아홉 종은 SPY보다 스프레드가
    넓으므로 **G6에서 먼저 깨질 수 있다**고 예상한다.
  universe_symbols:
    - AGG
    - DIA
    - EEM
    - EFA
    - GLD
    - IEF
    - IWM
    - LQD
    - QQQ
    - SHY
    - SLV
    - SPY
    - TIP
    - TLT
    - USO
    - VNQ
    - VTI
    - XLB
    - XLE
    - XLF
    - XLI
    - XLK
    - XLP
    - XLU
    - XLV
    - XLY
  horizon: >
    중기. 베타 추정 룩백 60~250 거래일, 리밸런스 일간.
  parameters_declared:      # ranges fixed in advance
    # N = 3 x 1 = 3. -001과 같은 격자.
    lookback: [60, 120, 250]
    gross: [0.8]
  chosen_declared: {lookback: 120, gross: 0.8}
  trials_run: 0             # N, counted automatically; input to the deflated Sharpe

